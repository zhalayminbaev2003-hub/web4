<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WEB-4</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f1e5d6; 
            padding: 20px; 
            font-family: Arial, sans-serif; 
        }
        .task-card { 
            background: #ffffff; 
            padding: 25px; 
            margin-bottom: 35px; 
            border-radius: 12px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
        }
        h2 { 
            font-size: 1.4rem; 
            border-bottom: 1px solid #ddd; 
            padding-bottom: 10px; 
            margin-bottom: 20px; 
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="text-center my-4">Forms and Validation</h1>

        <div class="task-card">
            <h2>Basic Form</h2>
            <form action="#" method="POST">
                <p>
                    <label for="name1">Name:</label><br>
                    <input type="text" id="name1" required maxlength="40">
                </p>
                <p>
                    <label for="email1">Email:</label><br>
                    <input type="email" id="email1" required>
                </p>
                <p>
                    <label for="msg1">Message:</label><br>
                    <textarea id="msg1" rows="3" required maxlength="200"></textarea>
                </p>
                <button type="submit">Send</button>
            </form>
        </div>

        <div class="task-card">
            <h2>Bootstrap Form</h2>
            <form class="needs-validation" novalidate>
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label for="name2" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="name2" required>
                        <div class="valid-feedback">Correct!</div>
                        <div class="invalid-feedback">Name is required.</div>
                    </div>
                    <div class="col-md-6">
                        <label for="email2" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email2" required>
                        <div class="valid-feedback">Correct!</div>
                        <div class="invalid-feedback">Enter a valid email.</div>
                    </div>
                </div>
                <div class="mb-3">
                    <label for="msg2" class="form-label">Message</label>
                    <textarea class="form-control" id="msg2" rows="3" required></textarea>
                    <div class="valid-feedback">Correct!</div>
                    <div class="invalid-feedback">Message is empty.</div>
                </div>
                <button class="btn btn-dark" type="submit">Submit Message</button>
            </form>
        </div>

        <div class="task-card">
            <h2>Registration Form</h2>
            <form class="needs-validation" novalidate>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label for="fName" class="form-label">First Name</label>
                        <input type="text" class="form-control" id="fName" required>
                        <div class="invalid-feedback">Fill this field.</div>
                    </div>
                    <div class="col-sm-6">
                        <label for="lName" class="form-label">Last Name</label>
                        <input type="text" class="form-control" id="lName" required>
                        <div class="invalid-feedback">Fill this field.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="regMail" class="form-label">Email</label>
                    <input type="email" class="form-control" id="regMail" required>
                    <div class="invalid-feedback">Invalid email format.</div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label for="pass" class="form-label">Password</label>
                        <input type="password" class="form-control" id="pass" minlength="8" required>
                        <div class="invalid-feedback">Minimum 8 characters.</div>
                    </div>
                    <div class="col-sm-6">
                        <label for="cPass" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="cPass" minlength="8" required>
                        <div class="invalid-feedback">Confirm your password.</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Gender</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="m" required>
                        <label class="form-check-label" for="m">Male</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="f" required>
                        <label class="form-check-label" for="f">Female</label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label d-block">Hobbies</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="h1">
                        <label class="form-check-label" for="h1">Sleeping</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="h2">
                        <label class="form-check-label" for="h2">Gaming</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" id="h3">
                        <label class="form-check-label" for="h3">Swimming</label>
                    </div>
                </div>

                <div class="mb-4">
                    <label for="country" class="form-label">Country</label>
                    <select class="form-select" id="country" required>
                        <option value="">Select your country...</option>
                        <option value="kz">Kazakhstan</option>
                        <option value="other">Other</option>
                    </select>
                    <div class="invalid-feedback">Please select a country.</div>
                </div>

                <button class="btn btn-dark w-100 mb-2" type="submit">Register Now</button>
                <button class="btn btn-outline-secondary w-100" type="reset">Clear Form</button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const forms = document.querySelectorAll('.needs-validation');
        Array.from(forms).forEach(form => {
            form.addEventListener('submit', event => {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    </script>
</body>
</html>
